<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Scrape-Verse // Edge Console</title>
<meta name="theme-color" content="#0B0E0C" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230B0E0C'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='%23FFB000'>&gt;</text></svg>" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="scanlines" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-glyph">&gt;_</span>
    <div class="brand-text">
      <span class="brand-name">EDGE&nbsp;CONSOLE</span>
      <span class="brand-sub">scrape-verse 2026 &middot; self-healing worker</span>
    </div>
  </div>
  <div class="status-cluster">
    <div class="status-pill" id="connStatus" data-state="offline">
      <span class="dot"></span>
      <span class="label">LINK DOWN</span>
    </div>
    <button class="icon-btn" id="settingsBtn" title="Agent settings" aria-label="Open settings">&#9881;</button>
  </div>
</header>

<main class="layout">
  <section class="control-panel">
    <div class="field-group">
      <label for="edgeUrl">EDGE ENDPOINT</label>
      <input id="edgeUrl" type="text" placeholder="https://your-tunnel.ngrok-free.app" autocomplete="off" />
    </div>

    <div class="field-group">
      <label for="targetUrl">TARGET URL</label>
      <input id="targetUrl" type="text" placeholder="https://example.com/products" autocomplete="off" />
    </div>

    <div class="field-group">
      <label for="targetSelector">SEED SELECTOR <span class="opt">(optional)</span></label>
      <input id="targetSelector" type="text" placeholder=".product-card, article, [data-item]" autocomplete="off" />
    </div>

    <button id="runBtn" class="run-btn">
      <span class="run-btn-glyph">&#9654;</span>
      <span>RUN SCRAPER</span>
    </button>

    <div class="meta-readout">
      <div class="meta-row"><span>Selector heals</span><span id="healCount">0</span></div>
      <div class="meta-row"><span>Records pulled</span><span id="recordCount">0</span></div>
      <div class="meta-row"><span>Session state</span><span id="sessionState">idle</span></div>
    </div>
  </section>

  <section class="terminal-wrap">
    <div class="terminal-header">
      <span>live execution log</span>
      <button id="clearLogBtn" class="ghost-btn">clear</button>
    </div>
    <div id="terminal" class="terminal" role="log" aria-live="polite"></div>
  </section>
</main>

<div id="settingsOverlay" class="overlay" hidden>
  <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="settings-head">
      <h2 id="settingsTitle">Agent Configuration</h2>
      <button id="closeSettings" class="icon-btn" aria-label="Close settings">&times;</button>
    </div>

    <div class="field-group">
      <label for="systemPrompt">SYSTEM PROMPT <span class="opt">(governs the healing agent)</span></label>
      <textarea id="systemPrompt" rows="7" placeholder="You are a resilient extraction agent. When a selector fails, infer the new semantic target from the accessibility tree and explain your reasoning in one line before returning the fixed selector..."></textarea>
    </div>

    <div class="field-group">
      <label for="llmProvider">HEALING MODEL</label>
      <select id="llmProvider">
        <option value="openai">OpenAI (gpt-4o-mini class)</option>
        <option value="gemini">Google Gemini</option>
      </select>
    </div>

    <div class="field-group">
      <label for="maxRetries">MAX HEAL ATTEMPTS PER RUN</label>
      <input id="maxRetries" type="number" min="1" max="10" value="3" />
    </div>

    <button id="saveSettings" class="run-btn">SAVE CONFIG</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="app.js"></script>
</body>
</html>
